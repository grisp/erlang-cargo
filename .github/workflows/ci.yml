name: CI

on:
  push:
  pull_request:
    branches: [ master ]

jobs:

  build:
    strategy:
      matrix:
        otp_version: [20, 21, 22, 23]

    runs-on: ubuntu-latest

    container:
      image: erlang:${{ matrix.otp_version }}

    steps:
    - uses: actions/checkout@v2
    - uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
    - name: Compile
      run: rebar3 compile
    - name: EUnit
      run: rebar3 eunit
    # libtest's JSON output is unstable; ordinary compilation stays on stable.
    - uses: actions-rs/toolchain@v1
      with:
        toolchain: nightly
    - name: Common Test
      env:
        RUSTUP_TOOLCHAIN: nightly
      run: rebar3 ct
